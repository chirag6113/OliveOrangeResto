name: Keep Render backend warm

on:
  push:
    branches:
      - main
  schedule:
    # Run every five minutes, offset from the top of the hour to reduce delays.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Request backend health endpoint
        run: >-
          curl --fail --silent --show-error --max-time 100
          --retry 1 --retry-delay 10 --retry-all-errors
          https://oliveorangeresto.onrender.com/api/
